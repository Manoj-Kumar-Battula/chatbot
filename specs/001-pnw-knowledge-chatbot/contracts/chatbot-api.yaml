openapi: 3.0.3
info:
  title: PNW Knowledge Chatbot API
  version: 0.1.0
  description: Public contract for a source-grounded university Q&A service.
paths:
  /api/chat/message:
    post:
      summary: Ask the chatbot a question.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionRequest'
      responses:
        '200':
          description: Chatbot answer generated from official sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResponse'
        '400':
          description: Invalid request.
components:
  schemas:
    QuestionRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          minLength: 1
          description: Natural-language question from student.
        campus:
          type: string
          nullable: true
          enum: [Hammond, Westville]
          description: Optional campus context when relevant.
        term:
          type: string
          nullable: true
          description: Optional term context supplied with the question.
        course:
          type: string
          nullable: true
          description: Optional course context supplied with the question.
    AnswerResponse:
      type: object
      required:
        - answer
        - citations
        - answer_type
      properties:
        answer:
          type: string
        answer_type:
          type: string
          enum: [direct_answer, clarification_required, insufficient_info, escalation_required]
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        escalation_destination:
          type: string
          nullable: true
        campus_used:
          type: string
          nullable: true
          enum: [Hammond, Westville, null]
        limitation:
          type: string
          nullable: true
          description: Explanation of missing, stale, conflicting, or unsupported evidence.
        source_status:
          type: string
          enum: [supported, stale, unknown, missing, conflicting, unsupported]
          description: Evidence status used to decide whether the answer can be stated confidently.
    Citation:
      type: object
      required:
        - source_id
        - title
        - url
        - excerpt
      properties:
        source_id:
          type: string
          description: Stable official source identity.
        version_id:
          type: string
          nullable: true
          description: Immutable source version used for this citation.
        title:
          type: string
        url:
          type: string
          format: uri
        excerpt:
          type: string
        source_date:
          type: string
          nullable: true
        freshness_status:
          type: string
          enum: [current, stale, unknown, missing]
        section_ref:
          type: string
          nullable: true
        page_or_anchor:
          type: string
          nullable: true
